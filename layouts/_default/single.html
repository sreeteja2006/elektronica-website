{{ define "main" }}
{{ partial "page-header.html" (dict "title" .Title) }}

<article class="pb-24 pt-10">
    <div class="shell">
        <div class="max-w-3xl">
            {{ with .Params.link }}
            <a href="{{ . }}" target="_blank" rel="noopener" class="btn btn-primary mb-10" data-reveal>Read on Medium</a>
            {{ end }}
            {{ with .Content }}
            <div class="prose-ek" data-reveal>{{ . }}</div>
            {{ end }}
        </div>
    </div>
</article>
{{ end }}
