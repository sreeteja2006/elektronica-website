{{ $current := . }}
<header class="sticky top-0 z-50 border-b border-ink-600 bg-ink-950">
    <div class="mx-auto flex h-16 max-w-[90rem] items-center justify-between px-6 sm:px-10 lg:px-14">
        <a href="/" class="flex items-center gap-3" aria-label="{{ .Site.Title }} home">
            <img src="/images/logo.jpeg" alt="" width="32" height="32" class="h-8 w-8 rounded-sm" />
            <span class="font-serif text-[1.7rem] leading-none text-ink-100">{{ .Site.Title }}</span>
        </a>

        <nav class="hidden items-center md:flex" aria-label="Main">
            {{ range site.Menus.main }}
            <a class="nav-link" href="{{ .URL | relLangURL }}"
               {{ if hasPrefix $current.RelPermalink .URL }}aria-current="page"{{ end }}>{{ .Name }}</a>
            {{ end }}
        </nav>

        <button id="menu-toggle" type="button"
                class="-mr-2 p-2 text-sm font-medium uppercase tracking-[0.16em] text-ink-100 md:hidden"
                aria-expanded="false" aria-controls="mobile-menu">
            <span data-menu-label>Menu</span>
        </button>
    </div>

    <nav id="mobile-menu" class="fixed inset-x-0 bottom-0 top-16 overflow-y-auto bg-ink-950 md:hidden" aria-label="Mobile" hidden>
        <div class="px-6 pt-6">
            {{ range site.Menus.main }}
            <a class="menu-link" href="{{ .URL | relLangURL }}"
               {{ if hasPrefix $current.RelPermalink .URL }}aria-current="page"{{ end }}>{{ .Name }}</a>
            {{ end }}
        </div>
    </nav>

    <div id="scroll-meter" class="absolute -bottom-px left-0 h-px w-full origin-left scale-x-0 bg-solder-400" aria-hidden="true"></div>
</header>
