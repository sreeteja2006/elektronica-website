{{ $current := . }}
<header class="sticky top-0 z-50 border-b border-white/[0.06] bg-ink-950/75 backdrop-blur-md">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
        <a href="/" class="group flex items-center gap-3" aria-label="{{ .Site.Title }} home">
            <img src="/images/logo.jpeg" alt="" width="36" height="36"
                 class="h-9 w-9 rounded-md ring-1 ring-ink-600 transition group-hover:ring-volt-400" />
            <span class="font-mono text-sm font-bold uppercase tracking-[0.2em] text-white">
                {{ .Site.Title }}<span class="ml-0.5 animate-blink text-volt-400" aria-hidden="true">_</span>
            </span>
        </a>

        <nav class="hidden items-center md:flex" aria-label="Main">
            {{ range site.Menus.main }}
            <a class="nav-link" href="{{ .URL | relLangURL }}"
               {{ if hasPrefix $current.RelPermalink .URL }}aria-current="page"{{ end }}>{{ .Name }}</a>
            {{ end }}
        </nav>

        <button id="menu-toggle" type="button"
                class="rounded-md border border-ink-600 p-2 text-slate-300 hover:border-volt-400 hover:text-volt-300 md:hidden"
                aria-expanded="false" aria-controls="mobile-menu" aria-label="Toggle menu">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
        </button>
    </div>

    <nav id="mobile-menu" class="border-t border-white/[0.06] bg-ink-950/95 px-4 pb-4 pt-2 md:hidden" aria-label="Mobile" hidden>
        {{ range site.Menus.main }}
        <a class="block rounded-md px-3 py-3 font-mono text-sm uppercase tracking-wider text-slate-300 hover:bg-ink-800 hover:text-volt-300"
           href="{{ .URL | relLangURL }}"
           {{ if hasPrefix $current.RelPermalink .URL }}aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
    </nav>

    <div id="scroll-meter" class="absolute -bottom-px left-0 h-[2px] w-full origin-left scale-x-0 bg-gradient-to-r from-volt-400 to-phos-400" aria-hidden="true"></div>
</header>
