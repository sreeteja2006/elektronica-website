{{ $current := . }}
<header class="sticky top-0 z-50 border-b border-ink-600 bg-ink-950">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
        <a href="/" class="flex items-center gap-3" aria-label="{{ .Site.Title }} home">
            <img src="/images/logo.jpeg" alt="" width="32" height="32" class="h-8 w-8 rounded-sm" />
            <span class="text-base font-semibold tracking-tight text-ink-100">{{ .Site.Title }}</span>
        </a>

        <nav class="hidden items-center md:flex" aria-label="Main">
            {{ range site.Menus.main }}
            <a class="nav-link" href="{{ .URL | relLangURL }}"
               {{ if hasPrefix $current.RelPermalink .URL }}aria-current="page"{{ end }}>{{ .Name }}</a>
            {{ end }}
        </nav>

        <button id="menu-toggle" type="button"
                class="rounded-sm border border-ink-500 p-2 text-ink-200 hover:border-ink-300 md:hidden"
                aria-expanded="false" aria-controls="mobile-menu" aria-label="Toggle menu">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
        </button>
    </div>

    <nav id="mobile-menu" class="border-t border-ink-600 bg-ink-950 px-4 pb-4 pt-2 md:hidden" aria-label="Mobile" hidden>
        {{ range site.Menus.main }}
        <a class="block px-3 py-3 text-base text-ink-200 hover:text-ink-100"
           href="{{ .URL | relLangURL }}"
           {{ if hasPrefix $current.RelPermalink .URL }}aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
    </nav>

    <div id="scroll-meter" class="absolute -bottom-px left-0 h-px w-full origin-left scale-x-0 bg-signal-400" aria-hidden="true"></div>
</header>
