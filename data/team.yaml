# Team page data. Everything below is PLACEHOLDER content (22 slots, same as the old site).
#
# Edit here, or use the /admin form (see .pages.yml). For each real member fill in
# the fields and untick/delete `placeholder`.
#
#   name      required
#   role      e.g. "Coordinator"
#   year      free text, e.g. "B.Tech 2027"
#   photo     path under static/, e.g. /images/team/jane.webp  (leave "" for a silhouette)
#   github    full URL, optional
#   linkedin  full URL, optional
#
# Photos: use ~800px wide, portrait or square, under 200 KB. The old photos in
# static/images/team/ are 3-7 MB each; compress before using.
