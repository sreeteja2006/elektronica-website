baseURL: ''
title: Elektronica
locale: en-us
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer: true
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

# Remote resources (the Medium RSS feed) are re-fetched at most once an hour
# instead of being cached forever between builds.
caches:
  getresource:
    maxAge: 1h

params:
  author: Pranjal Prajapati
  moto: "The platform for students to dream innovative practical projects and achieve them."
  description: "The Electronics and Signals club of IIT Hyderabad is a student organization that aims to increase student interest in electronics. The Club was founded in 2009, and it has come a long way since then."
  # Set this to the live address (no trailing slash), e.g. "https://elektronica.iith.dev".
  # While it is empty, the canonical link and social-preview (Open Graph) image
  # tags are left out, because they need absolute URLs.
  site_url: ""
  og_image: "/images/og-images/featured-img-placeholder.png"
  contact_email: "elektronica@gymkhana.iith.ac.in"

  p1:
    heading: "Our mission"
    image: "images/pages/our-mission.jpg"
    content:
      - text: "Philosophy: \"Learning by doing\" — Whether you're building, debugging, designing, or researching, there's a place for you here."

  p4:
    heading: "Explore Electronics and Signal Processing"
    content:
      - text: "Find the most insightful blogs on various topics here."

  # Blog posts are pulled from this Medium feed when the site is built.
  # If the feed can't be reached, the posts in content/posts/ are shown instead.
  blog:
    medium_profile: "https://medium.com/@elektronica"
    medium_feed: "https://medium.com/feed/@elektronica"
    max_posts: 10

  social_media:
    github:
      enabled: true
      url: 'https://github.com/orgs/Elektronica-IITH/repositories'
    instagram:
      enabled: true
      url: 'https://www.instagram.com/elektronica_iith'
    twitter:
      enabled: true
      url: 'https://x.com/xElektronica'
    medium:
      enabled: true
      url: 'https://medium.com/@elektronica'

menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 10
    - identifier: events
      name: Events
      url: /events/
      weight: 20
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 30
    - identifier: team
      name: Team
      url: /team/
      weight: 40
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 50
  footer:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 10
    - identifier: events
      name: Events
      url: /events/
      weight: 20
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 30
    - identifier: team
      name: Team
      url: /team/
      weight: 40
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 50

taxonomies:
  category: Categories
  tag: Tags

privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false
  instagram:
    disable: false
    simple: false
  twitter:
    disable: false
    enableDNT: false
    simple: false
  vimeo:
    disable: false
    enableDNT: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true

module:
  hugoVersion:
    extended: true
    # `try` (0.141) is used for the Medium feed fetch, `hugo.Data` (0.156) for the data files.
    min: "0.156.0"

# Machine-readable feeds for the future SciTech aggregator site.
# Published at /api/events.json, /api/projects.json, /api/posts.json.
outputFormats:
  ApiEvents:   { mediaType: application/json, baseName: api/events,   isPlainText: true, notAlternative: true }
  ApiProjects: { mediaType: application/json, baseName: api/projects, isPlainText: true, notAlternative: true }
  ApiPosts:    { mediaType: application/json, baseName: api/posts,    isPlainText: true, notAlternative: true }
outputs:
  home: [HTML, RSS, ApiEvents, ApiProjects, ApiPosts]
